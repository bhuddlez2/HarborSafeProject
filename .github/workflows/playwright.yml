name: Playwright Tests
on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*

    # 1. Install root dependencies (where Playwright/Axe usually live)
    - name: Install root dependencies
      run: npm ci

    # 2. Specifically install axe-core/playwright in the root to be safe
    - name: Ensure Axe is installed in root
      run: npm install @axe-core/playwright --save-dev

    # 3. Install frontend dependencies (for your Next.js app)
    - name: Install frontend dependencies
      run: npm ci --prefix frontend

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Install Playwright system deps
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps

    # 4. Run tests from root
    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: true

    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30